services:
  postgres:
    image: postgres:16-alpine
    container_name: cdrl_m01_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cdrl}
      POSTGRES_USER: ${POSTGRES_USER:-cdrl_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdrl_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
